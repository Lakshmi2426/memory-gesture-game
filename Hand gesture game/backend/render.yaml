services:
  - type: web
    name: memory-moves-backend
    runtime: node
    region: singapore          # Choose the region closest to your users
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        fromService: none      # Set manually in Render dashboard → Your Vercel URL
      - key: FIREBASE_PROJECT_ID
        sync: false            # Set in Render dashboard → Environment → Secret Files
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
